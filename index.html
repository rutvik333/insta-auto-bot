<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trigger Facebook & Instagram Bot | GitHub Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center font-sans p-4">

    <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 sm:p-8 max-w-lg w-full space-y-6">
        <!-- Title -->
        <div class="flex items-center gap-3 border-b border-slate-700 pb-4">
            <div class="w-12 h-12 rounded-xl bg-blue-600 flex items-center justify-center text-white text-2xl shadow-lg">
                <i class="fa-brands fa-github"></i>
            </div>
            <div>
                <h1 class="text-xl font-black text-white">GitHub Actions Trigger</h1>
                <p class="text-xs text-slate-400">Trigger Screen Rank Facebook Bot remotely</p>
            </div>
        </div>
        
        <form id="triggerForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">GitHub Username</label>
                    <input type="text" id="ghUser" required value="rutvik333" class="w-full bg-slate-900 text-white text-sm p-2.5 border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Repository Name</label>
                    <input type="text" id="ghRepo" required value="insta-auto-bot" class="w-full bg-slate-900 text-white text-sm p-2.5 border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Action to Perform</label>
                <select id="botAction" class="w-full bg-slate-900 text-white text-sm p-2.5 border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="fetch_facebook_data">🎬 Fetch Facebook Data Only (Screen Rank)</option>
                    <option value="fetch_and_post_instagram">📸 Fetch & Publish to Instagram</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">GitHub Personal Access Token (PAT)</label>
                <input type="password" id="ghToken" required placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full bg-slate-900 text-white text-sm p-2.5 border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono">
                <p class="text-[11px] text-slate-400 mt-1">Requires standard `repo` or `workflow` scope permissions.</p>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white py-3 rounded-xl font-bold transition flex items-center justify-center gap-2 shadow-lg shadow-blue-600/30 text-sm">
                <i class="fa-solid fa-play"></i> Trigger Bot on GitHub Actions
            </button>
        </form>

        <div id="statusMsg" class="p-3 rounded-lg text-xs font-semibold hidden text-center"></div>

        <div class="border-t border-slate-700 pt-4 flex items-center justify-between text-xs text-slate-400">
            <span>Direct GitHub UI:</span>
            <a href="https://github.com/rutvik333/insta-auto-bot/actions" target="_blank" class="text-blue-400 hover:text-blue-300 font-medium flex items-center gap-1">
                Open GitHub Actions Tab <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
        </div>
    </div>

    <script>
        const savedToken = localStorage.getItem('gh_bot_pat');
        if (savedToken) {
            document.getElementById('ghToken').value = savedToken;
        }

        document.getElementById('triggerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const user = document.getElementById('ghUser').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();
            const token = document.getElementById('ghToken').value.trim();
            const action = document.getElementById('botAction').value;
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('statusMsg');

            localStorage.setItem('gh_bot_pat', token);

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Triggering GitHub Action...`;
            status.classList.add('hidden');

            try {
                const response = await fetch(`https://api.github.com/repos/${user}/${repo}/actions/workflows/schedule.yml/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: {
                            action: action,
                            source: 'screenrank'
                        }
                    })
                });

                status.classList.remove('hidden');
                
                if (response.ok) {
                    status.innerHTML = `✅ <strong>Workflow triggered successfully!</strong><br><a href="https://github.com/${user}/${repo}/actions" target="_blank" class="underline text-emerald-300">Click here to view live execution logs on GitHub.</a>`;
                    status.className = "p-3 rounded-lg text-xs font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-center";
                } else {
                    const error = await response.json().catch(() => ({ message: response.statusText }));
                    status.innerHTML = `❌ <strong>Error:</strong> ${error.message}`;
                    status.className = "p-3 rounded-lg text-xs font-medium bg-rose-500/20 text-rose-300 border border-rose-500/30 text-center";
                }
            } catch (err) {
                status.classList.remove('hidden');
                status.innerHTML = `❌ <strong>Network Error:</strong> ${err.message}`;
                status.className = "p-3 rounded-lg text-xs font-medium bg-rose-500/20 text-rose-300 border border-rose-500/30 text-center";
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-play"></i> Trigger Bot on GitHub Actions`;
            }
        });
    </script>
</body>
</html>
